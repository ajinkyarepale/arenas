# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Import this from the Render dashboard (New → Blueprint) and it configures the
# service for you. The three secrets are marked `sync: false`, so Render will
# prompt for them instead of reading them from this file — never commit real
# credentials here.
#
# Free instance types cannot run pre-deploy commands, one-off jobs, or a shell,
# so database migrations and seeding are run from your own machine against the
# Supabase connection string. See DEPLOY.md, Appendix B.

services:
  - type: web
    name: arenas
    runtime: docker
    plan: free
    # oregon | ohio | virginia | frankfurt | singapore
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    # Cheap, database-free liveness check that also reports whether the round
    # scheduler is alive in the process.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase session-pooler URI, with ?sslmode=require appended.
      - key: DATABASE_URL
        sync: false
      # node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: NEXTAUTH_SECRET
        sync: false
      # Must exactly match the public URL, https, no trailing slash.
      - key: NEXTAUTH_URL
        sync: false
      # Optional: Google sign-in (leave empty to hide the Google button).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: OTP email delivery via Resend (leave empty for log-only dev fallback).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
