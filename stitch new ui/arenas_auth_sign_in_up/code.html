<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-sm text-body-sm">
<!-- Background Gradient Effect -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.15) 0%, transparent 60%);"></div>
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Brand Header (Centered) -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-primary font-bold">Arena</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-stack-sm">Prediction Market</p>
</div>
<!-- Auth Card Container -->
<div class="bg-surface-glass backdrop-blur-xl border border-border-neutral rounded-xl p-stack-lg shadow-2xl relative">
<!-- Views Container -->
<div class="relative overflow-hidden" id="auth-views" style="height: auto;">
<!-- Sign In View -->
<div class="w-full transition-all duration-300 ease-in-out transform translate-x-0 opacity-100" id="signin-view">
<h2 class="font-headline-md text-headline-md mb-stack-md">Sign in to Arena</h2>
<!-- Error Alert (Hidden by default) -->
<div class="hidden bg-error-container/20 border border-error-coral/50 rounded-lg p-stack-sm mb-stack-md flex items-start gap-stack-sm" id="signin-error">
<span class="material-symbols-outlined text-error-coral" style="font-variation-settings: &quot;FILL&quot; 1;">error</span>
<p class="text-error-coral font-body-sm text-body-sm">Invalid email or password. Please try again.</p>
</div>
<form class="flex flex-col gap-stack-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="signin-email">Email</label>
<input class="w-full bg-surface-container border border-border-neutral rounded-[12px] px-stack-md py-3 font-data-mono-sm text-data-mono-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline" id="signin-email" placeholder="you@college.edu" type="email">
</div>
<div>
<div class="flex justify-between items-center mb-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="signin-password">Password</label>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-surface-container border border-border-neutral rounded-[12px] px-stack-md py-3 font-data-mono-sm text-data-mono-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline" id="signin-password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-primary text-on-primary font-nav-item text-nav-item rounded-full py-3 mt-stack-sm hover:bg-primary-fixed-dim transition-colors font-bold" type="button">Sign in</button>
</form>
<!-- Quick Fill Demo -->
<div class="mt-stack-lg border-t border-border-neutral pt-stack-md">

<div class="flex gap-stack-sm">
<button class="flex-1 border border-border-neutral bg-surface-container hover:bg-surface-container-high rounded-full py-2 font-label-caps text-label-caps text-on-surface-variant transition-colors" onclick="fillDemo('organizer@college.edu')" type="button">Organizer</button>
<button class="flex-1 border border-border-neutral bg-surface-container hover:bg-surface-container-high rounded-full py-2 font-label-caps text-label-caps text-on-surface-variant transition-colors" onclick="fillDemo('participant@college.edu')" type="button">Participant</button>
</div>
</div>
<div class="mt-stack-md text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Don't have an account? 
                            <button class="text-primary hover:underline font-bold ml-1" onclick="toggleView('signup')" type="button">Sign up</button>
</p>
</div>
</div>
<!-- Sign Up View (Hidden by default) -->
<div class="w-full transition-all duration-300 ease-in-out transform translate-x-full opacity-0 hidden absolute top-0 left-0" id="signup-view">
<h2 class="font-headline-md text-headline-md mb-stack-md">Create an account</h2>
<form class="flex flex-col gap-stack-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="signup-name">Display Name</label>
<input class="w-full bg-surface-container border border-border-neutral rounded-[12px] px-stack-md py-3 font-data-mono-sm text-data-mono-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline" id="signup-name" placeholder="Campus Trader" type="text">
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="signup-email">Email</label>
<input class="w-full bg-surface-container border border-border-neutral rounded-[12px] px-stack-md py-3 font-data-mono-sm text-data-mono-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline" id="signup-email" placeholder="you@college.edu" type="email">
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="signup-password">Password</label>
<input class="w-full bg-surface-container border border-border-neutral rounded-[12px] px-stack-md py-3 font-data-mono-sm text-data-mono-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline" id="signup-password" placeholder="••••••••" type="password">
</div>
<!-- Role Selector -->
<div class="mt-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">Select Role</label>
<div class="flex flex-col gap-stack-sm">
<!-- Participant Option -->
<label class="relative flex cursor-pointer p-stack-md border border-border-neutral rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors group">
<input checked="" class="peer sr-only" name="role" type="radio" value="participant">
<div class="flex items-center gap-stack-md">
<div class="w-5 h-5 rounded-full border border-outline peer-checked:border-success-neon peer-checked:border-[6px] flex items-center justify-center transition-all"></div>
<div>
<p class="font-nav-item text-nav-item text-primary mb-1 group-hover:text-success-neon transition-colors">Participant</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs">Join markets &amp; trade positions</p>
</div>
</div>
<span class="absolute inset-0 border-2 border-transparent peer-checked:border-success-neon rounded-lg pointer-events-none transition-colors opacity-50"></span>
</label>
<!-- Organizer Option -->
<label class="relative flex cursor-pointer p-stack-md border border-border-neutral rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors group">
<input class="peer sr-only" name="role" type="radio" value="organizer">
<div class="flex items-center gap-stack-md">
<div class="w-5 h-5 rounded-full border border-outline peer-checked:border-primary peer-checked:border-[6px] flex items-center justify-center transition-all"></div>
<div>
<p class="font-nav-item text-nav-item text-primary mb-1">Organizer</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs">Host events &amp; manage liquidity</p>
</div>
</div>
<span class="absolute inset-0 border-2 border-transparent peer-checked:border-primary rounded-lg pointer-events-none transition-colors opacity-50"></span>
</label>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-nav-item text-nav-item rounded-full py-3 mt-stack-md hover:bg-primary-fixed-dim transition-colors font-bold" type="button">Create account</button>
</form>
<div class="mt-stack-md text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Already have an account? 
                            <button class="text-primary hover:underline font-bold ml-1" onclick="toggleView('signin')" type="button">Sign in</button>
</p>
</div>
</div>
</div>
</div>
</div>
<script>
        function toggleView(targetView) {
            const signin = document.getElementById('signin-view');
            const signup = document.getElementById('signup-view');
            
            if (targetView === 'signup') {
                // Hide Sign In
                signin.classList.remove('translate-x-0', 'opacity-100');
                signin.classList.add('-translate-x-full', 'opacity-0');
                
                // Show Sign Up
                signup.classList.remove('hidden');
                // Force reflow
                void signup.offsetWidth;
                signup.classList.remove('translate-x-full', 'opacity-0');
                signup.classList.add('translate-x-0', 'opacity-100');
                
                setTimeout(() => {
                    signin.classList.add('hidden');
                    signup.classList.remove('absolute', 'top-0', 'left-0');
                    signin.classList.add('absolute', 'top-0', 'left-0');
                }, 300);
            } else {
                // Hide Sign Up
                signup.classList.remove('translate-x-0', 'opacity-100');
                signup.classList.add('translate-x-full', 'opacity-0');
                
                // Show Sign In
                signin.classList.remove('hidden');
                // Force reflow
                void signin.offsetWidth;
                signin.classList.remove('-translate-x-full', 'opacity-0');
                signin.classList.add('translate-x-0', 'opacity-100');
                
                setTimeout(() => {
                    signup.classList.add('hidden');
                    signin.classList.remove('absolute', 'top-0', 'left-0');
                    signup.classList.add('absolute', 'top-0', 'left-0');
                }, 300);
            }
        }

        function fillDemo(email) {
            document.getElementById('signin-email').value = email;
            document.getElementById('signin-password').value = 'demo123';
            
            // Highlight error state for demonstration
            if(email === 'organizer@college.edu') {
                document.getElementById('signin-error').classList.remove('hidden');
                document.getElementById('signin-email').classList.add('border-error-coral', 'focus:border-error-coral', 'focus:ring-error-coral');
                document.getElementById('signin-password').classList.add('border-error-coral', 'focus:border-error-coral', 'focus:ring-error-coral');
            } else {
                 document.getElementById('signin-error').classList.add('hidden');
                 document.getElementById('signin-email').classList.remove('border-error-coral', 'focus:border-error-coral', 'focus:ring-error-coral');
                 document.getElementById('signin-password').classList.remove('border-error-coral', 'focus:border-error-coral', 'focus:ring-error-coral');
            }
        }
    </script>
</body></html>
