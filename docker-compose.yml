services:
  postgres:
    image: postgres:16-alpine
    container_name: arenas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arenas
      POSTGRES_PASSWORD: arenas
      POSTGRES_DB: arenas
    ports:
      - '5432:5432'
    volumes:
      - arenas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arenas -d arenas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arenas-pgdata:
